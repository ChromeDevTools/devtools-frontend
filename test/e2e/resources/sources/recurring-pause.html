<!DOCTYPE html>
<meta charset="utf-8">
<script>
function runLoop(iterations) {
  let completed = 0;
  for (let i = 0; i < iterations; i++) {
    completed++;
  }
  return completed;
}

function runDebuggerLoop(iterations) {
  let completed = 0;
  for (let i = 0; i < iterations; i++) {
    debugger;
    completed++;
  }
  return completed;
}
</script>
